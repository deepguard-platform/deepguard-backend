x-model-stub: &model-stub
  build:
    context: .
    dockerfile: model_stubs/Dockerfile
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-model-a:
    <<: *model-stub
    environment:
      MODALITY: video
      MODEL_NAME: video-model-a

  video-model-b:
    <<: *model-stub
    environment:
      MODALITY: video
      MODEL_NAME: video-model-b

  audio-model-a:
    <<: *model-stub
    environment:
      MODALITY: audio
      MODEL_NAME: audio-model-a

  text-model-a:
    <<: *model-stub
    environment:
      MODALITY: text
      MODEL_NAME: text-model-a

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MODEL_URL_MODE: docker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      video-model-a:
        condition: service_healthy
      video-model-b:
        condition: service_healthy
      audio-model-a:
        condition: service_healthy
      text-model-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
